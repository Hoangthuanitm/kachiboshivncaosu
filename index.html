<!-- Font tải nền, không chặn việc hiện trang; trong lúc chờ dùng font có sẵn của máy -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one narrow working column (phone at the machine first), sticky header with account + tabs,
   each tab is a stack of plain panels; the monthly grid mirrors the paper form (day rows x shift columns). */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --ink:#141a2d; --muted:#5a6379; --line:#d8ddea;
  --accent:#2440b3; --accent-ink:#ffffff; --accent-soft:#e5eafb;
  --ok:#12733f; --ok-soft:#dcf2e5; --ng:#bb261e; --ng-soft:#fde3e0; --wait:#8c5a08; --wait-soft:#fbedd0;
  --font:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --jp:"Hiragino Sans","Yu Gothic","Noto Sans JP","Be Vietnam Pro",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e121f; --surface:#171c2d; --ink:#e7eaf5; --muted:#99a2b8; --line:#2a3148;
  --accent:#93a6ff; --accent-ink:#0e121f; --accent-soft:#222b52;
  --ok:#62d597; --ok-soft:#143425; --ng:#ff8d83; --ng-soft:#44201d; --wait:#f0c26c; --wait-soft:#3b2e12;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e121f; --surface:#171c2d; --ink:#e7eaf5; --muted:#99a2b8; --line:#2a3148;
  --accent:#93a6ff; --accent-ink:#0e121f; --accent-soft:#222b52;
  --ok:#62d597; --ok-soft:#143425; --ng:#ff8d83; --ng-soft:#44201d; --wait:#f0c26c; --wait-soft:#3b2e12;
  color-scheme:dark }

*{box-sizing:border-box}
/* Giao diện cố định trên điện thoại: không phóng to khi chạm 2 lần, không chụm để zoom, không tự zoom khi chạm vào ô nhập */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y}
body{overflow-x:hidden;touch-action:pan-x pan-y;overscroll-behavior-x:none}
button,.btn,.slot,.okng button,.tabs button,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.btn,.slot,.chip,.role,.tabs{-webkit-user-select:none;user-select:none}
/* iOS tự phóng to khi chạm vào ô nhập có chữ nhỏ hơn 16px: ép mọi ô nhập luôn 16px ở mọi cỡ màn hình */
input,select,textarea,input[type=text],input[type=password],input[type=month],input[type=time]{font-size:16px !important}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:900px;margin:0 auto;padding-inline:16px}
.top-in{display:flex;flex-direction:column;gap:10px;padding-block:12px 0}
.brand{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.brandL{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 220px}
.brandL .logo{flex:none;height:48px;width:auto;background:#fff;border-radius:6px;padding:2px}
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opbtn{font:inherit;font-size:17px;font-weight:600;padding:18px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:center;min-height:64px}
.opbtn:active{background:var(--accent-soft);border-color:var(--accent)}
.pinbox{display:grid;gap:12px;max-width:320px}
.pinname{font-size:20px;font-weight:700}
#opPin{font-family:var(--mono);font-size:28px !important;letter-spacing:.5em;text-align:center}
.opbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.who .role.op{background:var(--ok-soft);color:var(--ok)}
.ltable{display:grid;gap:8px}
.ldefs{display:grid;gap:6px;min-width:0}
.ldef{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,2.5fr) 40px;gap:8px;align-items:center}
.chead{font-weight:500;color:var(--wait,#8c5a08)}.chint{display:none;color:var(--wait,#8c5a08);margin-top:3px}.oldnote{margin-top:3px}
.lhead .ldef{gap:8px}
.xdef{padding:6px 0;min-height:40px}
.addef{justify-self:start}
.lrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,3.9fr) 142px;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;background:var(--surface)}
.lrow:not(.lhead){align-items:start}
.lrow.saved{border-left-color:var(--ok)} .lrow.dirty,.lrow.new{border-left-color:var(--wait)}
.lrow.lhead{border:0;padding:0 10px 0 14px;background:none;font-size:12px;color:var(--muted);font-weight:600}
.lrow select,.lrow input{width:100%;min-width:0;padding:8px 8px;min-height:40px}
.lc{min-width:0}
.lq{display:flex;gap:6px}
.qi{display:flex;align-items:center;gap:3px;flex:1;min-width:0}
.qi input{min-width:52px}
.qi input{text-align:center;font-family:var(--mono);padding:8px 4px}
.qi span{font-size:12px;color:var(--muted)}
.lact{display:flex;gap:6px;justify-content:flex-end}
.lmeta{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.lrow.dirty .lmeta,.lrow.new .lmeta{color:var(--wait)}
.ml{display:none;font-size:12px;color:var(--muted);margin-bottom:2px}
/* Báo cáo sản xuất: màn hình rộng thì mỗi sản phẩm một dòng; iPad dọc 2 hàng; điện thoại xếp dọc */
main.wrap:has(> #tab-daily:not([hidden])){max-width:1240px}
.ltable{container-type:inline-size}
@container (max-width:900px){
  .lrow.lhead{display:none}
  .ml{display:block}
  .chint{display:block}
  .lrow{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;row-gap:10px}
  .ldefs{grid-column:1/-1;order:3}
  .lmeta{order:4}
  .lact{justify-content:flex-end;align-self:end}
}
@container (max-width:560px){
  .lrow{grid-template-columns:1fr 1fr}
  .ldef{grid-template-columns:minmax(0,1fr) 40px}
.ldef .lc:nth-child(1),.ldef .lc:nth-child(2){grid-column:1/-1}
  .ldef .lc:nth-child(3){grid-column:1/2}
  .ldef .xdef{grid-column:2;justify-self:end;width:40px}
.ldef .xdef{align-self:end;min-height:40px}
  .lc.lp{grid-column:1/-1}
  .lact{grid-column:1/-1;justify-content:flex-start}
}

.pblock h3{margin:0 0 6px;font-size:14px}
.panel.danger{border-color:var(--ng)}
.panel.danger h2{color:var(--ng)}

function makeDb(){
  const col = firebase.firestore().collection(COLLECTION);
  const wrap = (d, p) => ({id:d.id.slice(p.length), exists:d.exists, data:() => d.data()});
  return {
    doc(path){ const i = path.indexOf("/"), c = path.slice(0,i), p = TYPES[c]+"_", ref = col.doc(p+path.slice(i+1));
      return { set:d => ref.set(Object.assign({type:TYPES[c]}, d)), delete:() => ref.delete(), get:() => ref.get().then(s => wrap(s,p)),
               onSnapshot:(n,e) => ref.onSnapshot(s => n(wrap(s,p)), e) }; },
    /* "assign" lọc theo ngày (adate) nên không kèm điều kiện type, tránh phải tạo composite index */
    collection(c){ const p = TYPES[c]+"_"; let q = c==="assign" ? col : col.where("type","==",TYPES[c]);
      const docs = sn => sn.docs.filter(d => d.id.indexOf(p)===0).map(d => wrap(d,p));
      const api = { where(f,op,v){ q = q.where(f,op,v); return api; }, limit(n){ q = q.limit(n); return api; },
        get:() => q.get().then(sn => ({docs:docs(sn)})),
        onSnapshot:(n,e) => q.onSnapshot(sn => n({docs:docs(sn)}), e) };
      return api; }
  };

const MACHINE_JA = {"Máy in sấy PVC 1":"PVC加工機 1号機", "Máy in sấy PVC 2":"PVC加工機 2号機", "Máy in sấy PVC 3":"PVC加工機 3号機", "Máy in PVC logo":"PVCロゴプリント機", "Máy in PVC tự động":"PVC自動プリント機"};
const mJa = m => (m && m.nameJa || "").trim() || MACHINE_JA[m && m.name] || "";
const mName = n => { if(!n || S.lang!=="ja") return n||""; const m = S.cfg.machines.find(x => x.name===n); return (m && mJa(m)) || MACHINE_JA[n] || n; };
const meName = () => S.me.id==="owner" ? T("Chủ trang") : S.me.name;
const isJa = s => /[぀-ヿ一-鿿]/.test(s);
const needTr = s => (S.lang==="ja") !== isJa(s);
function trKey(s){ let a = 0x811c9dc5, b = 5381; for(let i=0;i<s.length;i++){ const c = s.charCodeAt(i); a = Math.imul(a^c, 16777619); b = (Math.imul(b,33)+c)|0; } return (a>>>0).toString(16)+"-"+(b>>>0).toString(16)+"-"+s.length; }
function trPlain(s){ if(!s || !needTr(s)) return s||""; return S.tr.get(trKey(s)) || s; }
function txt(s){
  if(!s) return ""; if(!needTr(s)) return esc(s);
  const k = trKey(s), o = S.tr.get(k);
  if(o) return esc(o)+'<span class="orig">'+esc(s)+'</span>';
  if(S.sample && !S.trTried.has(k)){ S.trQueue.add(s); clearTimeout(txt.h); txt.h = setTimeout(runTr, 700); return esc(s)+' <span class="sub">'+T("(đang dịch…)")+'</span>'; }
  return esc(s);
}

const jaName = s => { const k = String(s||"").trim(); return (S.listJa.products||{})[k] || (S.listJa.defects||{})[k] || LIST_JA[k] || ""; };
const jaOf = (kind, s) => (S.listJa[kind]||{})[s] || LIST_JA[s] || "";
/* Hiện tên sản phẩm / nguyên nhân theo ngôn ngữ đang chọn; chuỗi ghép bằng ", " hoặc "; " được dịch từng phần */
function nm(s){ if(!s || S.lang!=="ja") return s||""; return String(s).split(/(, |; )/).map(p => jaName(p) || p).join(""); }
function nmTxt(s){ if(!s || S.lang!=="ja") return txt(s);
  const ps = String(s).split("; "); if(!ps.some(p => jaName(p))) return txt(s);
  if(ps.every(p => jaName(p))) return esc(nm(s))+'<span class="orig">'+esc(s)+'</span>';
  return ps.map(p => jaName(p) ? esc(jaName(p)) : txt(p)).join("; "); }
const nmPlain = s => !s || S.lang!=="ja" ? trPlain(s) : String(s).split("; ").map(p => jaName(p) || trPlain(p)).join("; ");
async function translateBatch(texts, target){
  const r = await fetch("https://translation.googleapis.com/language/translate/v2?key="+encodeURIComponent(TRANSLATE_API_KEY), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({q:texts, target:target, format:"text"})});
  if(!r.ok) throw new Error("translate "+r.status);
  return (await r.json()).data.translations.map(t => t.translatedText);
}
async function runTr(){
  if(S.trBusy || !S.trQueue.size || !S.sample) return;
  S.trBusy = true;
  const items = [...S.trQueue].slice(0,20); items.forEach(s => { S.trQueue.delete(s); S.trTried.add(trKey(s)); });
  try{
    for(const target of ["ja","vi"]){
      const part = items.filter(s => isJa(s) ? target==="vi" : target==="ja"); if(!part.length) continue;
      const out = await translateBatch(part, target);
      for(let i=0;i<part.length;i++){ const o = String(out[i]||"").trim(); if(!o) continue; const k = trKey(part[i]); S.tr.set(k, o);
        try{ await S.db.doc("tr/"+k).set({src:part[i], out:o}); }catch(e){} }
    }
  }catch(e){ S.sample = null; }
  S.trBusy = false; refresh();
  if(S.trQueue.size) setTimeout(runTr, 700);
}
function refresh(){ render(); if(S.me && S.tab==="report") renderReport(); }

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>{t.hidden=true;},3400); }
function stateOf(c, a){ if(!a || a.checkAt!==c.at) return "pending"; return a.status==="approved" ? "approved" : "returned"; }
function stateText(st){ return T(st==="approved" ? "Đã duyệt" : st==="returned" ? "Trả lại – kiểm lại" : "Chờ duyệt"); }
function stateChip(st){ return '<span class="chip '+(st==="approved"?"ok":st==="returned"?"ng":"wait")+'">'+stateText(st)+'</span>'; }
function resultText(c){ return T(isPass(c) ? "Đạt" : "Không đạt"); }
function resultChip(c){ return '<span class="chip '+(isPass(c)?"ok":"ng")+'">'+resultText(c)+'</span>'; }
/* Đúng giờ/trễ luôn tính lại theo giờ quy định hiện tại của ngày đó (giờ chuẩn hoặc giờ tổ trưởng điều chỉnh) */
function liveTiming(c){ if(!c || !c.firstAt || !c.date || !S.cfg.times[c.shift]) return c; const t = timesFor(c.date, c.machineId, c.shift), d = new Date(c.firstAt), m = d.getHours()*60+d.getMinutes();
  return m > toMin(t.due) ? {timing:"late", lateMin:m-toMin(t.due)} : m < toMin(t.from) ? {timing:"early", lateMin:0} : {timing:"ontime", lateMin:0}; }
function timingText(c){ c = liveTiming(c); return c.timing==="late" ? T("Trễ {n} phút",{n:c.lateMin}) : c.timing==="early" ? T("Kiểm quá sớm") : T("Đúng giờ"); }
function timingChip(c){ c = liveTiming(c); return '<span class="chip '+(c.timing==="late"?"ng":c.timing==="early"?"wait":"ok")+'">'+timingText(c)+'</span>'; }
/* Giờ quy định: mặc định cố định (admin cài trong Cài đặt); tổ trưởng/admin điều chỉnh riêng cho từng ngày khi có thay đổi */
const TKEYS = SLOTS;
const hm = m => { m = Math.max(0, Math.min(1439, m)); return pad(Math.floor(m/60))+":"+pad(m%60); };
function baseTimes(){ const o = {}; SLOTS.forEach(k => { o[k] = (S.cfg.times[k] || DEFAULT_TIMES[k]).due; }); return o; }
function schedOf(date, mid){ return (mid && S.sched.get(date+"_"+mid)) || S.sched.get(date+"_all") || null; }
function dayTimes(date, mid){ const all = S.sched.get(date+"_all"), one = mid && mid!=="all" && S.sched.get(date+"_"+mid); return Object.assign(baseTimes(), all && all.t, one && one.t); }
function stepAt(date, mid, k){ return dayTimes(date, mid)[k]; }
function timesFor(date, mid, shift){ return {from:(S.cfg.times[shift] || DEFAULT_TIMES[shift]).from, due:dayTimes(date, mid)[shift]}; }
function tkName(k){ const ja = S.lang==="ja", i = STEPS.find(x => x.k===k); return i ? (ja ? i.sj : i.short) : stageName(k); }
function schedDiff(x){ const b = baseTimes(); return TKEYS.filter(k => x.t && x.t[k] && x.t[k]!==b[k]).map(k => tkName(k)+' <b class="mono">'+esc(x.t[k])+'</b>').join(" · "); }
function lateBy(t, at){ return t && at ? Math.max(0, toMin(t)-toMin(at)) : 0; }
function statusCell(t, at){ if(!t) return '<span class="sub">—</span>'; const n = lateBy(t, at); return n ? '<span class="chip ng">'+T("Trễ {n} phút",{n:n})+'</span>' : '<span class="chip ok">'+T("Đúng giờ")+'</span>'; }
function timingAt(shift, d, mid){ const t = timesFor(ymd(d), mid || (isDevice() ? devMid() : S.slot && S.slot.machine), shift), m = d.getHours()*60+d.getMinutes();
  if(m > toMin(t.due)) return {timing:"late", lateMin:m-toMin(t.due)};
  if(m < toMin(t.from)) return {timing:"early", lateMin:0};
  return {timing:"ontime", lateMin:0}; }
const slotId = () => S.today+"_"+S.slot.shift+"_"+S.slot.machine;
/* Máy tổ trưởng phụ trách: chưa chọn máy nào = phụ trách tất cả (giữ như cũ) */
const leadMachines = () => S.me && S.me.role==="leader" && Array.isArray(S.me.machines) && S.me.machines.length ? S.me.machines : null;
const mineM = mid => { const l = leadMachines(); return !l || l.includes(mid); };
/* Máy dùng chung (nhiều tổ trưởng cùng phụ trách, ví dụ PVC 3): công nhân chọn gửi cho tổ trưởng nào thì chỉ người đó thấy và duyệt */
const leadersOf = mid => [...S.accounts.entries()].filter(([,a]) => a.role==="leader" && a.active && (a.machines||[]).includes(mid)).sort((x,y) => x[1].name.localeCompare(y[1].name));
const isShared = mid => leadersOf(mid).length > 1;
const forMe = c => mineM(c.machineId) && (!S.me || S.me.role!=="leader" || !c.leaderId || c.leaderId===S.me.id);
/* Phiếu kiểm duyệt 2 cấp: tổ trưởng duyệt → quản đốc duyệt cuối. fState: lead · wait (chờ QĐ) · final · mret (QĐ trả lại → về tổ trưởng) */
const FAPPR_START = "2026-10-30";   /* phiếu tổ trưởng đã duyệt trước ngày áp dụng duyệt 2 cấp: coi như đã xong, không đẩy sang quản đốc */
function fState(id, c){ const a = S.apprs.get(id); if(stateOf(c, a)!=="approved") return "lead"; const f = S.fapprs.get(id);
  if(!f && a.at && a.at.slice(0,10) < FAPPR_START) return "legacy";
  return f && f.checkAt===c.at && f.apprAt===a.at ? (f.status==="approved" ? "final" : "mret") : "wait"; }
const pendingList = () => [...S.checks.entries()].filter(([id,c]) => (stateOf(c,S.apprs.get(id))==="pending" || fState(id,c)==="mret") && forMe(c)).sort((a,b)=> a[1].at<b[1].at?1:-1);

  return ITEMS.map(i => '<span class="mark'+(c[i.k]==="NG"?" ng":"")+'">'+(ja?i.sj:i.short)+' <b class="mono">'+esc(i.k==="temp" ? (c.tempVal||"")+(c.temp2Val?"/"+c.temp2Val:"")+"°C" : (c.speedVal||""))+'</b> '+sym(c[i.k])+'</span>').join("")
  +(c.shift==="S" ? PROC_ITEMS.map(i => '<span class="mark'+(c[i.k]==="NG"?" ng":"")+'">'+(ja?i.sj:i.short)+' '+sym(c[i.k])+'</span>').join("") : '')
  +(c.product ? '<span class="mark">'+esc(nm(c.product))+'</span>' : '')
  +(c.shift==="S" && c.steps ? '<div class="who">'+STEPS.map(i => '<span>'+(ja?i.sj:i.short)+' <b class="mono">'+esc(c.steps[i.k]||"")+'</b>'+(c.stepsBy && c.stepsBy[i.k] ? ' · '+esc(c.stepsBy[i.k]) : '')+'</span>').join("")+'</div>' : '')
  +(c.stepsLog && c.stepsLog.length ? '<div class="edited" style="flex:1 1 100%">'+c.stepsLog.map(l => esc(logText(l))).join("<br>")+'</div>' : ''); }
/* Bảng chi tiết phiếu cho tổ trưởng: đúng trình tự kiểm tra, mỗi bước một dòng */
function checkParts(c){ const ja = S.lang==="ja", st = S.steps.get(c.date+"_"+c.machineId) || {}, rows = [], irows = [], late = (t, at) => t && at && t>at;
  const cell = v => v ? esc(v) : '<span class="sub">—</span>';
  if(c.shift==="S") STEPS.forEach(i => { const t = (c.steps||{})[i.k] || st[i.k] || "", by = (c.stepsBy||{})[i.k] || st[i.k+"By"] || "";
    const res = i.k==="sample" ? ((c.sampleProduct || st.sampleProduct) ? '<b>'+esc(c.sampleProduct || st.sampleProduct)+'</b> · ' : '')+PROC_ITEMS.map(p => esc(ja ? p.sj : p.short)+' <b class="'+(c[p.k]==="NG"?"ngt":"okt")+'">'+(sym(c[p.k])||"—")+'</b>').join(" · ") : (t ? '<b class="okt">✓</b>' : '<b class="ngt">'+T("Chưa làm")+'</b>');
    const note = i.k==="sample" ? (c.sampleNote || st.sampleNote || "") : (st[i.k+"Note"] || "");
    const at = stepAt(c.date, c.machineId, i.k);
    rows.push([esc(ja ? i.sj : i.short)+'<small>'+T("Trước {t}",{t:at})+'</small>', res, t ? '<span class="mono'+(late(t, at) ? " ngt" : "")+'">'+esc(t)+'</span>' : cell(""), statusCell(t, at), cell(by), note ? txt(note) : cell(""), (i.k==="sample" && (c.sampleQ==="NG" || c.gloss==="NG" || c.sample==="NG"))]); });
  const tw = timesFor(c.date, c.machineId, c.shift), due = tw.due, ft = fmtTime(c.firstAt), sc = ft && toMin(ft) < toMin(tw.from) ? '<span class="chip wait">'+T("Kiểm quá sớm")+'</span>' : statusCell(ft, due);
  if(isQ(c.shift)){ irows.push([esc(T("Tên sản phẩm"))+'<small>'+T("Phải xong trước {t}",{t:due})+'</small>', '<b>'+esc(c.product||"—")+'</b>', '<span class="mono'+(lateBy(ft, due) ? " ngt" : "")+'">'+ft+'</span>', sc, cell(c.checker), c.note ? txt(c.note) : cell(""), false]);
    QITEMS.forEach(i => irows.push([esc(ja ? i.sj : i.short), '<b class="'+(c[i.k]==="NG"?"ngt":"okt")+'">'+(sym(c[i.k])||"—")+'</b>', '', '', '', '', c[i.k]==="NG"])); }
  else ITEMS.forEach(i => { const v = i.k==="temp" ? (c.tempVal||"")+(c.temp2Val ? "/"+c.temp2Val : "")+"°C" : (c.speedVal||""), note = i.k==="temp" ? c.noteTemp : c.noteSpeed;
    irows.push([esc(ja ? i.sj : i.short)+'<small>'+T("Phải xong trước {t}",{t:due})+'</small>', '<span class="mono">'+esc(v)+'</span> <b class="'+(c[i.k]==="NG"?"ngt":"okt")+'">'+sym(c[i.k])+'</b>', '<span class="mono'+(lateBy(ft, due) ? " ngt" : "")+'">'+ft+'</span>', sc, cell(c.checker), note ? txt(note) : (i.k==="temp" && c.note && c.noteTemp===undefined ? txt(c.note) : cell("")), c[i.k]==="NG"]); });
  const so = schedOf(c.date, c.machineId), edits = (c.stepsLog||[]).filter(l => l.act==="edit" || l.act==="cancel" || l.act==="proxy" || l.act==="medit" || l.act==="mdel").map(logText)
    .concat((c.hist||[]).map((hh, n, arr) => T("{by} sửa phiếu kiểm lúc {t}",{by:hh.editBy||hh.by||"", t:fmtTime(n+1<arr.length ? arr[n+1].at : c.at)})+" · "+T("số cũ: {v}",{v:isQ(c.shift) ? [hh.product, QITEMS.map(i => sym(hh[i.k])||"—").join("/")].filter(Boolean).join(" ") : (hh.tempVal||"")+"°C / "+(hh.speedVal||"")})));
  const ext = (st.samples||[]).map(x => [esc(ja ? "サンプル" : "Chạy mẫu")+' '+(x.n+1)+'<small>'+T("Khi đổi mã hàng")+'</small>', '<b>'+esc(nm(x.product)||"—")+'</b> · '+PROC_ITEMS.map(p => { const v = p.k==="sample" ? x.sampleQ : x.gloss; return esc(ja ? p.sj : p.short)+' <b class="'+(v==="NG"?"ngt":"okt")+'">'+(sym(v)||"—")+'</b>'; }).join(" · "), '<span class="mono">'+esc(x.time||"")+'</span>', '<span class="sub">—</span>', cell(x.by), x.note ? txt(x.note) : cell(""), x.sampleQ==="NG" || x.gloss==="NG"]);
  return {steps:rows, items:irows, ext:ext, edits:edits, so:so}; }
function detailHtml(secs, edits, so){ let n = 0;
  return (so && schedDiff(so) ? '<div class="sub">'+T("Giờ quy định ngày này đã điều chỉnh ({by}):",{by:so.by||""})+' '+schedDiff(so)+'</div>' : '')+'<div class="scroll"><table class="dtab"><tr><th>#</th><th>'+T("Hạng mục")+'</th><th>'+T("Kết quả")+'</th><th>'+T("Giờ")+'</th><th>'+T("Trạng thái")+'</th><th>'+T("Phụ trách")+'</th><th>'+T("Ghi chú")+'</th></tr>'
    +secs.filter(x => x[1].length).map(([lab, rows]) => (lab ? '<tr class="secrow"><td colspan="7">'+esc(lab)+'</td></tr>' : '')
      +rows.map(r => '<tr'+(r[6] ? ' class="ngrow"' : '')+'><td class="mono">'+(++n)+'</td><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td class="wrap">'+r[5]+'</td></tr>').join("")).join("")+'</table></div>'
    +(edits.length ? '<details class="hist"><summary>'+T("Lịch sử sửa ({n})",{n:edits.length})+'</summary>'+edits.map(esc).join("<br>")+'</details>' : ''); }
function checkDetail(id, c){ const p = checkParts(c); return detailHtml([[null, p.steps.concat(p.ext, p.items)]], p.edits, p.so); }
/* Gộp các phiếu cùng ngày, cùng máy vào một bảng theo đúng trình tự: đầu ca → kiểm sáng → kiểm chiều */
function groupDetail(list){ const secs = [], edits = []; let so = null, extDone = false;
  list.slice().sort((a,b) => SLOTS.indexOf(a[1].shift)-SLOTS.indexOf(b[1].shift)).forEach(([id,c]) => { const p = checkParts(c); so = so || p.so;
    if(c.shift==="S") secs.push([T("Đầu ca"), p.steps]); if(!extDone && p.ext.length){ secs.push([T("Chạy mẫu khi đổi mã hàng"), p.ext]); extDone = true; } secs.push([stageName(c.shift), p.items]); p.edits.forEach(x => edits.push(x)); });
  return detailHtml(secs, edits, so); }
/* Nhật ký can thiệp của tổ trưởng vào bước đầu ca */
function logText(l){ const i = STEPS.find(x => x.k===(isSampK(l.k||"") ? "sample" : l.k)) || {}, name = (S.lang==="ja" ? i.sj : i.short)+(isSampK(l.k||"") && sampN(l.k) ? " "+(sampN(l.k)+1) : "");
  if(l.act==="medit") return T("{by} sửa “{step}” lúc {t}: {a} → {b}. Lý do: {r}",{by:l.by, step:name, t:fmtTime(l.at), a:l.prev||"", b:l.next||"", r:l.reason});
  if(l.act==="mdel") return T("{by} xoá “{step}” ({a}) lúc {t}. Lý do: {r}",{by:l.by, step:name, a:l.prev||"", t:fmtTime(l.at), r:l.reason});

async function hashPw(salt, pw){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt+":"+pw)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); }
const newSalt = () => [...crypto.getRandomValues(new Uint8Array(8))].map(x => x.toString(16).padStart(2,"0")).join("");

const OWNER = () => ({id:"owner", name:"Chủ trang", role:"admin", machines:[], shifts:["S","C"]});
async function doLogin(){

  S.me = Object.assign({id:id}, a); lsSet("caosu_session", id); S.form.dirty = S.dform.dirty = S.sform.dirty = false; S.dform.key = ""; S.op = null; S.opPick = null;

async function firstAdmin(){
  if(S.busy) return;
  const id = $("#faId").value.trim().toLowerCase(), name = $("#faName").value.trim(), pw = $("#faPw").value;
  if(!/^[a-z0-9._-]{3,20}$/.test(id)) return toast(T("ID gồm 3–20 ký tự: chữ thường không dấu, số, dấu . _ -"));
  if(S.accounts.has(id)) return toast(T("ID này đã có. Chọn ID khác."));
  if(!name) return toast(T("Hãy nhập họ tên."));
  if(pw.length<4) return toast(T("Mật khẩu cần ít nhất 4 ký tự."));
  S.busy = true;
  try{ const salt = newSalt(), doc = {name:name, role:"admin", active:true, machines:[], shifts:["S","C"], salt:salt, hash:await hashPw(salt,pw), createdBy:id, createdByName:name, updatedAt:new Date().toISOString()};
    await S.db.doc("accounts/"+id).set(doc); S.accounts.set(id, doc); S.me = Object.assign({id:id}, doc); lsSet("caosu_session", id); S.tab = "accounts";
    if(document.activeElement) document.activeElement.blur(); render(); }
  catch(err){ toast(T(err && err.code==="permission-denied" ? "Firestore từ chối quyền ghi. Kiểm tra Security Rules." : "Chưa lưu được tài khoản. Thử lại.")); }
  S.busy = false;
}
function syncSession(){
  if(S.me && S.me.id!=="owner"){ const a = S.accounts.get(S.me.id); if(!a || !a.active || a.role==="worker"){ S.me=null; lsSet("caosu_session",null); toast(T("Tài khoản đã bị khoá hoặc xoá.")); } else S.me = Object.assign({id:S.me.id}, a); }
  if(!S.me){ const sid = lsGet("caosu_session");
    if(sid==="owner" && S.isOwner) S.me = OWNER();
    else if(sid && S.accounts.has(sid) && S.accounts.get(sid).active && S.accounts.get(sid).role!=="worker") S.me = Object.assign({id:sid}, S.accounts.get(sid)); }
  if(S.op){ const o = S.accounts.get(S.op.id); if(!o || !o.active || !S.me || S.me.role!=="device") S.op = null; }
}

/* ---------- check tab ---------- */
/* Công đoạn phân công riêng cho từng người: 4 bước đầu ca + kiểm máy sáng + kiểm máy chiều */
const STAGES = [{c:"S"}, {c:"QS"}, {c:"C"}, {c:"QC"}];
const STAGE_LABEL = {S:"Kiểm máy sáng", QS:"Kiểm chất lượng sáng", C:"Kiểm máy chiều", QC:"Kiểm chất lượng chiều", R:"Báo cáo cuối ngày"};
function stageName(c){ const st = STAGES.find(x => x.c===c); if(st.step){ const i = STEPS.find(x => x.k===st.step); return S.lang==="ja" ? i.jp : i.vi; } return T(STAGE_LABEL[c]); }
function stageShort(c){ const st = STAGES.find(x => x.c===c); if(st.step){ const i = STEPS.find(x => x.k===st.step); return S.lang==="ja" ? i.sj : i.short; } return T(STAGE_LABEL[c]); }
const isDevice = () => !!S.me && S.me.role==="device";
const isMgr = () => !!S.me && (S.me.role==="admin" || S.me.role==="manager");   /* Admin và Quản đốc dùng chung giao diện quản lý */

/* Công nhân tạo trước khi có PIN dùng mã mặc định 1234 cho tới khi tự đổi */

const actor = () => isDevice() ? S.op : S.me;
function myStages(date, mid){ const out = new Set(); if(isDevice()){ if(mid===S.me.machineId) STAGES.forEach(st => out.add(st.c)); return out; } STAGES.forEach(st => { const as = S.assign.get(date+"_"+st.c+"_"+mid); if(as && as.workerId===S.me.id) out.add(st.c); }); return out; }

function loadForm(){
  const c = S.checks.get(slotId());
  S.form.vals = {}; ITEMS.concat(PROC_ITEMS).forEach(i => { if(c && c[i.k]) S.form.vals[i.k]=c[i.k]; });
  S.form.nums = {temp:c ? (c.tempVal||"") : "", temp2:c ? (c.temp2Val||"") : "", speed:c ? (c.speedVal||"") : ""};

/* Giá trị đo và khoảng chuẩn của từng máy */
const curMachine = () => S.cfg.machines.find(x => x.id===S.slot.machine) || {};
const numOf = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const has = v => v!==null && v!==undefined && v!=="";
function rangeText(lo, hi){ return has(lo) && has(hi) ? lo+" – "+hi : has(lo) ? "≥ "+lo : has(hi) ? "≤ "+hi : ""; }
function limitsOf(mc, k){ return k==="temp" ? [["temp", mc.tMin, mc.tMax]].concat(mc.two ? [["temp2", mc.t2Min, mc.t2Max]] : []) : [["speed", mc.sMin, mc.sMax]]; }
/* Nếu máy có đặt khoảng chuẩn: tự đánh giá OK/× theo số đã nhập. Trả null khi chưa đủ dữ liệu để đánh giá. */
function judge(mc, k){ let any = false, bad = false;
  for(const [f, lo, hi] of limitsOf(mc, k)){ if(!has(lo) && !has(hi)) continue; const v = S.form.nums[f]; if(!has(v)) return null; any = true;
    const n = numOf(v); if(n===null || (has(lo) && n<lo) || (has(hi) && n>hi)) bad = true; }
  return any ? (bad ? "NG" : "OK") : null; }
const prodList = () => S.form.product ? S.form.product.split(", ").filter(Boolean) : [];
const qtyText = n => { n = n||0; return [Math.floor(n/12) ? Math.floor(n/12)+" "+T("tá") : "", n%12 ? (n%12)+" "+T("đôi") : ""].filter(Boolean).join(" ") || "0"; };
const b2Text = d => qtyText(d.b2Total);
const stepsKey = () => S.today+"_"+S.slot.machine;
function mySchedule(){ const out = [];
  for(let i=0;i<7;i++){ const date = addDays(mondayOf(S.today), i); if(date<S.today || isOff(date)) continue; const items = [];
    S.cfg.machines.forEach(m => { const st = myStages(date, m.id); if(st.size) items.push((multi() ? mName(m.name)+": " : "")+STAGES.filter(x => st.has(x.c)).map(x => stageShort(x.c)).join(", ")); });
    if(items.length) out.push([date, items]); }
  return out; }
function scheduleHtml(){ if(isDevice()) return ''; const sc = mySchedule();

      +'<span class="t">'+(done ? '<span class="mono">'+esc(done)+'</span>' : T("Bấm khi xong"))+'</span></button>'; }).join(""); }
async function markStep(k){

function renderCheck(){

async function changePin(){
  if(S.busy) return; const id = $("#pcName").value, a = id && S.accounts.get(id), o = $("#pcOld").value, n1 = $("#pcNew").value, n2 = $("#pcNew2").value;

  if(n1!==n2) return toast(T("Hai lần nhập mã PIN không khớp."));
  const ok = await pinOk(a, o); if(ok==="lock") return toast(T("Nhập sai nhiều lần. Chờ 1 phút rồi thử lại.")); if(!ok) return toast(T("Mã PIN hiện tại không đúng."));

  try{ await S.db.doc("accounts/"+id).set(Object.assign({}, a, {pin:n1, pinChangedAt:new Date().toISOString(), updatedAt:new Date().toISOString()})); S.pinChg = false; toast(T("Đã đổi mã PIN.")); }
  catch(err){ toast(T("Chưa lưu được. Kiểm tra mạng rồi bấm lưu lại.")); }

}

function pinMsg(m){ const el = $("#pinErr"); if(el){ el.textContent = m; el.hidden = !m; } if(m) toast(m); }
async function opConfirm(){
  const a = S.opPick && S.accounts.get(S.opPick), el = $("#opPin"); if(!a || !el || S.opChecking) return;
  if(Date.now()<S.opLock) return pinMsg(T("Nhập sai nhiều lần. Chờ 1 phút rồi thử lại."));
  const pin = el.value.replace(/\D/g,""); if(!pin && $("#pinErr") && !$("#pinErr").hidden) return; if(pin.length!==4) return pinMsg(T("Mã PIN gồm đúng 4 chữ số."));
  /* PIN lưu dạng số; công nhân tạo ở bản cũ (chỉ có mật khẩu mã hoá) dùng 1234 hoặc mã đã đặt trước đó */
  S.opChecking = true; let ok = false;
  try{ ok = a.pin ? pin===a.pin : (pin===DEFAULT_PIN || (!!a.salt && !!a.hash && (await hashPw(a.salt, pin))===a.hash)); }catch(e){ ok = !a.pin && pin===DEFAULT_PIN; }

  loadForm(); renderCheck(); render(); window.scrollTo(0,0);

    hist.push({act:"edit", line:prev.product||"", qty:prev.qty, total:prev.b2||0, nqty:qty, ntotal:b2, by:S.me.name, at:at}); lines[idx] = nl; }

    toast(doc.timing==="late" ? T("Đã lưu. Lần cập nhật này sau hạn 20:00.") : T(prev ? "Đã cập nhật." : "Đã lưu sản phẩm.")); }
  catch(err){ toast(T(err && err.code==="permission-denied" ? "Firestore từ chối quyền ghi. Kiểm tra Security Rules." : "Chưa lưu được. Kiểm tra mạng rồi bấm lưu lại.")); }

function compressImage(file){
  return new Promise((res, rej) => { const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => { const img = new Image(); img.onerror = rej;
      img.onload = () => { let side = 1100, q = 0.72, out = "";
        for(let i=0;i<6;i++){ const k = Math.min(1, side/Math.max(img.width,img.height)), cv = document.createElement("canvas");
          cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
          out = cv.toDataURL("image/jpeg", q); if(out.length < 220000) break; side = Math.round(side*0.8); q -= 0.08; }
        out.length < 240000 ? res(out) : rej(new Error("big")); };
      img.src = fr.result; };
    fr.readAsDataURL(file); });
}

function todayBoard(opt){ const ms = S.cfg.machines.filter(m => mineM(m.id)); if(!ms.length) return '';
  /* cao su: chỉ hiện máy đã có ít nhất một phiếu kiểm hôm nay; máy chưa kiểm coi như hôm nay không dùng */
  const gs = dayGroups(ms.map(m => [null, {date:S.today, machineId:m.id, machineName:m.name}])).filter(g => SLOTS.some(k => g[k]));
  const rows = gs.map(g => [null, {date:g.date, machineId:g.mid, machineName:g.name}]);
  const head = '<div class="panel"><h2>'+T("Tiến độ hôm nay ({d})",{d:fmtDate(S.today).slice(0,5)})+'</h2>';
  if(!gs.length) return head+'<div class="notice">'+T("Hôm nay chưa có máy nào được kiểm.")+'</div></div>';
  const cnt = f => gs.filter(f).length, n = gs.length;
  const sum = '<span class="chip ok">'+T("Máy đang chạy: {n}/{t}",{n:n, t:ms.length})+'</span> '+SLOTS.map(k => [shiftL(k), cnt(g => g[k])])
    .map(([l,v]) => '<span class="chip '+(v===n ? "ok" : v ? "wait" : "plain")+'">'+l+' '+v+'/'+n+'</span>').join(" ");
  return head+'<div class="sub">'+T("Máy hiện ra ngay khi công nhân lưu phiếu kiểm đầu tiên, không cần chờ tổ trưởng duyệt.")+'</div><div class="row" style="flex-wrap:wrap;gap:6px;margin:6px 0">'+sum+'</div>'+dayTable(rows, opt)+'</div>'; }

  if(isMgr()){ const mp = mgrPending(), canAct = S.me.role==="manager";
    h += '<div class="panel"><h2>'+T("Báo cáo sản xuất chờ quản đốc duyệt ({n})",{n:mp.length})+'</h2>'+(mp.length ? mp.map(([k,d]) => mgrDailyCard(k, d, canAct)).join("") : '<div class="notice">'+T("Không có báo cáo nào chờ duyệt. Báo cáo hiện ở đây sau khi tổ trưởng xác nhận.")+'</div>')+'</div>'; }
  const done = [...S.checks.entries()].filter(([id,c]) => stateOf(c,S.apprs.get(id))!=="pending" && forMe(c)).sort((a,b)=> a[1].at<b[1].at?1:-1).slice(0,20);

async function writeAppr(id, status, note, action){
  const c = S.checks.get(id); if(!c) return;
  if(!forMe(c)) throw new Error(T("Máy này không thuộc tổ trưởng của bạn."));
  const ap = {date:c.date, month:c.month, status:status, checkAt:c.at, approverId:S.me.id, approver:S.me.name, by:S.uid, at:new Date().toISOString(), note:note||"", action:action||""};
  await S.db.doc("approvals/"+id).set(ap); sheetSend([sheetApprRow(id, ap, c)]);
}
$("#tab-approve").addEventListener("input", e => { if(e.target.dataset.dret) S.dretNote = e.target.value; });
$("#tab-approve").addEventListener("click", async e => { const b = e.target.closest("button"); if(!b || S.busy || !S.me || !isFinal()) return;
  if(b.dataset.mret){ S.dreturning = b.dataset.mret; S.dretNote = ""; return renderApprove(); }
  if(b.dataset.dretno){ S.dreturning = null; return renderApprove(); }
  const k = b.dataset.mok || b.dataset.dretsend; if(!k) return; const d = S.daily.get(k); if(!d) return;
  if(b.dataset.dretsend && !(S.dretNote||"").trim()) return toast(T("Hãy ghi lý do trả lại."));
  S.busy = true; b.disabled = true;
  try{ await dapprWrite(k, b.dataset.mok ? {status:"approved", dailyAt:d.at, approver:finName(), approverId:S.me.id, byAdmin:S.me.role==="admin", at:new Date().toISOString(), retNote:""} : {status:"returned", dailyAt:d.at, approver:finName(), approverId:S.me.id, byAdmin:S.me.role==="admin", at:new Date().toISOString(), retNote:S.dretNote.trim()});
    if(b.dataset.dretsend) S.dreturning = null; toast(T(b.dataset.mok ? "Đã phê duyệt báo cáo." : "Đã trả lại cho tổ trưởng.")); }
  catch(err){ toast(T("Chưa lưu được. Thử lại.")); }
  S.busy = false; renderApprove(); render(); });
$("#tab-approve").addEventListener("input", e => { if(e.target.dataset.sreason && S.stepAct) S.stepAct.reason = e.target.value; if(e.target.dataset.ret) S.returnNote = e.target.value; if(e.target.dataset.action) S.actions[e.target.dataset.action] = e.target.value; });
$("#tab-approve").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b || S.busy) return;
  if(b.dataset.photo){ b.disabled = true; await fetchPhoto(b.dataset.photo); return renderApprove(); }
  if(S.me.role!=="leader") return;
  if(b.dataset.sact){ S.stepAct = {id:b.dataset.sid, act:b.dataset.sact, reason:""}; return renderApprove(); }
  if(b.dataset.sno){ S.stepAct = null; return renderApprove(); }
  if(b.dataset.sgo) return leaderStep();
  if(b.dataset.dok){ const k = b.dataset.dok, d = S.daily.get(k); if(!d) return; S.busy = true; b.disabled = true;
    try{ await S.db.doc("dappr/"+k).set({date:d.date, month:d.month, status:"approved", dailyAt:d.at, total:d.b2Total||0, approverId:S.me.id, approver:S.me.name, at:new Date().toISOString()}); toast(T("Đã duyệt.")); }
    catch(err){ toast(T("Chưa lưu được. Thử lại.")); }
    S.busy = false; return renderApprove(); }
  const act = b.dataset.act, id = b.dataset.id;
  if(act==="ret"){ S.returning = id; S.returnNote = ""; return renderApprove(); }
  if(act==="retCancel"){ S.returning = null; return renderApprove(); }
  const ids = (id||"").split(",").filter(Boolean);
  if(act==="ok"){ if(ids.some(i => { const c = S.checks.get(i); return c && !isPass(c); }) && !(S.actions[id]||"").trim()) return toast(T("Phiếu có lỗi: hãy ghi biện pháp đã thực hiện trước khi duyệt.")); }
  if(act==="retSend" && !S.returnNote.trim()) return toast(T("Hãy ghi lý do trả lại."));
  S.busy = true; b.disabled = true;
  try{
    if(act==="ok"){ for(const i of ids){ const c = S.checks.get(i); await writeAppr(i,"approved","",c && !isPass(c) ? (S.actions[id]||"").trim() : ""); } delete S.actions[id]; toast(T("Đã duyệt.")); }
    else if(act==="retSend"){ for(const i of ids) await writeAppr(i,"returned",S.returnNote.trim(),""); S.returning=null; toast(T("Đã trả lại cho công nhân.")); }
    else if(b.id==="approveAll"){ const ids = pendingList().filter(([,c]) => isPass(c)).map(([i]) => i); for(const i of ids) await writeAppr(i,"approved","",""); toast(T("Đã duyệt {n} phiếu.",{n:ids.length})); }
  }catch(err){ toast(T(err && err.code==="permission-denied" ? "Firestore từ chối quyền ghi. Kiểm tra Security Rules." : "Chưa lưu được. Thử lại.")); }
  S.busy = false; renderApprove();
});

async function saveAcc(){
  const isNew = S.editAcc==="__new", admin = isMgr();
  const id = isNew ? $("#accId").value.trim().toLowerCase() : S.editAcc, prev = S.accounts.get(id);
  const name = $("#accName").value.trim(), pw = $("#accPw").value;
  if(isNew && !/^[a-z0-9._-]{3,20}$/.test(id)) return toast(T("ID gồm 3–20 ký tự: chữ thường không dấu, số, dấu . _ -"));
  if(isNew && (prev || id==="owner")) return toast(T("ID này đã có. Chọn ID khác."));
  if(!name) return toast(T("Hãy nhập họ tên."));
  const role = admin ? $("#accRole").value : "worker";
  if(role==="worker"){ if(pw && !/^\d{4}$/.test(pw)) return toast(T("Mã PIN của công nhân gồm đúng 4 chữ số.")); }
  else if((isNew || pw || (prev && prev.role==="worker")) && pw.length<4) return toast(T("Mật khẩu cần ít nhất 4 ký tự."));
  const machineId = role==="device" ? $("#accMachine").value : "";
  if(role==="device" && !machineId) return toast(T("Hãy chọn máy cho tài khoản iPad."));
  if(!admin && prev && prev.role!=="worker") return toast(T("Tổ trưởng chỉ sửa được tài khoản công nhân."));
  if(S.me.role!=="admin" && ((prev && prev.role==="admin") || role==="admin")) return toast(T("Chỉ Admin sửa được tài khoản Admin."));
  const shifts = ["S","C"], machines = role==="leader" ? [...document.querySelectorAll("[data-accm]:checked")].map(x => x.dataset.accm) : (prev && !admin ? (prev.machines||[]) : []);
  if(role==="leader" && !machines.length) return toast(T("Hãy chọn ít nhất một máy tổ trưởng phụ trách."));
  const doc = {name:name, role:role, active:isNew ? true : $("#accActive").checked, machines:machines, shifts:shifts.length?shifts:["S","C"], machineId:machineId,
    salt:prev?prev.salt:"", hash:prev?prev.hash:"", createdBy:prev?prev.createdBy:S.me.id, createdByName:prev?prev.createdByName:S.me.name, updatedAt:new Date().toISOString()};
  if(role==="worker") doc.pin = pw || (prev && prev.role==="worker" && prev.pin) || DEFAULT_PIN;
  S.busy = true;
  try{ if(role!=="worker" && (isNew || pw)){ doc.salt = newSalt(); doc.hash = await hashPw(doc.salt, pw); }
    await S.db.doc("accounts/"+id).set(doc); S.editAcc = null; toast(isNew ? T("Đã tạo tài khoản {id}.",{id:id}) : T("Đã lưu tài khoản.")); }
  catch(err){ toast(T(err && err.code==="permission-denied" ? "Firestore từ chối quyền ghi. Kiểm tra Security Rules." : "Chưa lưu được tài khoản. Thử lại.")); }
  S.busy = false; renderAccounts();
}

/* ---------- assign tab (phân công theo tuần) ---------- */
function isSunday(s){ const p = s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]).getDay()===0; }
function isSaturday(s){ const p = s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]).getDay()===6; }
/* Ngày không cần kiểm: mọi Chủ nhật, và Thứ bảy nào được tổ trưởng đánh dấu là ngày nghỉ */
function isOff(s){ return isSunday(s) || S.off.has(s); }
function addDays(s, n){ const p = s.split("-").map(Number); return ymd(new Date(p[0], p[1]-1, p[2]+n)); }
function mondayOf(s){ const p = s.split("-").map(Number), d = new Date(p[0], p[1]-1, p[2]); return addDays(s, -((d.getDay()+6)%7)); }
function workerList(){ return [...S.accounts.entries()].filter(([,a]) => a.role==="worker" && a.active).sort((x,y) => x[1].name.localeCompare(y[1].name)); }
function defaultFor(a, sh, mid){ return (!a.machines || !a.machines.length || a.machines.includes(mid)) && (!a.shifts || a.shifts.includes(sh)); }
function renderAssign(){
  const box = $("#tab-assign"), ws = workerList(), days = [0,1,2,3,4,5].map(i => addDays(S.week, i)), ms = S.cfg.machines;
  if(!ms.some(m => m.id===S.asgMachine)) S.asgMachine = ms[0].id;
  const mid = S.asgMachine;
  let h = '<div class="panel"><div class="row between"><h2>'+T("Phân công theo tuần")+'</h2><div class="row"><button class="btn sm" data-wk="-7" aria-label="'+T("Tuần trước")+'">◀</button><span class="mono">'+fmtDate(days[0]).slice(0,5)+' – '+fmtDate(days[5])+'</span><button class="btn sm" data-wk="7" aria-label="'+T("Tuần sau")+'">▶</button></div></div>'
    +'<div class="sub">'+T("Chọn người cho từng công đoạn. Ô chưa chọn thì chưa có ai phụ trách.")+'</div>';
  if(!ws.length){ box.innerHTML = h+'<div class="notice">'+T("Chưa có tài khoản công nhân nào. Tạo ở tab Tài khoản trước.")+'</div></div>'; return; }
  const opts = sel => ws.map(([id,a]) => '<option value="'+esc(id)+'"'+(id===sel?" selected":"")+'>'+esc(a.name)+'</option>').join("");
  if(ms.length>1) h += '<div class="seg" id="asgMachines">'+ms.map(m => '<button type="button" data-am="'+esc(m.id)+'" aria-pressed="'+(m.id===mid)+'">'+esc(mName(m.name))+'</button>').join("")+'</div>';
  h += '<div class="card"><b>'+T("Điền nhanh cho máy đang chọn")+'</b><div class="row"><select id="qfWorker" class="grow" aria-label="'+T("Chọn công nhân")+'"><option value=""'+(S.qfWorker?"":" selected")+'>'+T("Chọn công nhân")+'</option>'+opts(S.qfWorker)+'</select>'
    +'<select id="qfStage" class="grow" aria-label="'+T("Công đoạn")+'"><option value="">'+T("Tất cả công đoạn")+'</option>'+STAGES.map(x => '<option value="'+x.c+'"'+(x.c===S.qfStage?" selected":"")+'>'+esc(stageShort(x.c))+'</option>').join("")+'</select></div>'
    +'<div class="row"><button class="btn sm" data-qf="fill">'+T("Điền cả tuần")+'</button><button class="btn sm warn" data-qf="clear">'+T("Xoá phân công tuần này")+'</button></div></div>'
    +'<div class="row"><button class="btn" data-qf="copy">'+T("Sao chép phân công tuần trước (tất cả máy)")+'</button><span class="sub">'+T("Chỉ điền vào ô còn trống.")+'</span></div>';
  h += '<div class="list">';
  days.forEach(date => { const past = date<S.today, sat = isSaturday(date), off = S.off.has(date);
    h += '<div class="day'+(past?" off":"")+(date===S.today?" today":"")+'"><div class="dayh"><span><b>'+dowOf(date)+'</b> <span class="mono">'+fmtDate(date).slice(0,5)+'</span></span>'
      +(sat ? '<label class="offt"><input type="checkbox" data-off="'+date+'"'+(off?" checked":"")+(past?" disabled":"")+'>'+T("Ngày nghỉ")+'</label>' : '')+'</div><div class="dayg">';
    if(off) h += '<div class="notice" style="grid-column:1/-1">'+T("Ngày nghỉ – không cần kiểm máy.")+'</div>';
    else STAGES.forEach(x => { const key = date+"_"+x.c+"_"+mid, as = S.assign.get(key), sel = as ? as.workerId : "", stp = x.step ? STEPS.find(y => y.k===x.step) : null;
      h += '<label class="f"><span class="lab"><span>'+esc(stageShort(x.c))+'</span>'+(stp ? '<span class="mono">'+stp.at+'</span>' : '')+'</span><select class="asg'+(sel?" set":"")+'" data-as="'+esc(key)+'"'+(past?" disabled":"")+'>'
        +'<option value=""'+(sel?"":" selected")+'>'+T("Chọn")+'</option>'+opts(sel)
        +(sel && !ws.some(([id]) => id===sel) ? '<option value="'+esc(sel)+'" selected>'+esc(as.workerName||sel)+'</option>' : '')+'</select></label>'; });
    h += '</div></div>'; });
  box.innerHTML = h+'</div></div>';
}
async function setAssign(key, wid){
  if(!wid) return S.db.doc("assign/"+key).delete();
  const p = key.split("_");
  return S.db.doc("assign/"+key).set({adate:p[0], shift:p[1], machineId:p[2], workerId:wid, workerName:(S.accounts.get(wid)||{}).name||wid, by:S.me.id, at:new Date().toISOString()});
}
$("#tab-assign").addEventListener("change", async e => {
  const el = e.target;
  if(el.id==="qfWorker"){ S.qfWorker = el.value; return; }
  if(el.id==="qfStage"){ S.qfStage = el.value; return; }
  if(el.dataset.off){ el.blur(); const d = el.dataset.off;
    try{ if(el.checked) await S.db.doc("off/"+d).set({date:d, month:d.slice(0,7), by:S.me.id, at:new Date().toISOString()}); else await S.db.doc("off/"+d).delete(); toast(T("Đã lưu phân công.")); }
    catch(err){ toast(T("Chưa lưu được phân công.")); renderAssign(); }
    return; }
  if(!el.dataset.as) return;
  el.blur();
  try{ await setAssign(el.dataset.as, el.value); toast(T("Đã lưu phân công.")); }catch(err){ toast(T("Chưa lưu được phân công.")); renderAssign(); }
});
$("#tab-assign").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b || S.busy) return;
  if(b.dataset.wk){ S.week = addDays(S.week, +b.dataset.wk); return renderAssign(); }
  if(b.dataset.am){ S.asgMachine = b.dataset.am; return renderAssign(); }
  const qf = b.dataset.qf; if(!qf) return;
  if(qf==="clear" && b.dataset.sure!=="1"){ b.dataset.sure = "1"; b.textContent = T("Bấm lần nữa để xoá"); return; }
  if(qf==="copy"){ S.busy = true; let n = 0;
    try{ for(let i=0;i<6;i++){ const date = addDays(S.week, i); if(date<S.today || isOff(date)) continue;
        for(const m of S.cfg.machines) for(const st of STAGES){ const src = S.assign.get(addDays(date,-7)+"_"+st.c+"_"+m.id), k = date+"_"+st.c+"_"+m.id, acc = src && S.accounts.get(src.workerId);
          if(src && src.workerId && acc && acc.active && !S.assign.has(k)){ await setAssign(k, src.workerId); n++; } } }
      toast(n ? T("Đã sao chép {n} ô từ tuần trước.",{n:n}) : T("Không có ô nào để sao chép: tuần trước chưa phân công, hoặc tuần này đã đủ.")); }
    catch(err){ toast(T("Chưa lưu được phân công.")); }
    S.busy = false; return renderAssign(); }
  const wid = S.qfWorker || "", mid = S.asgMachine, codes = qf==="fill" && S.qfStage ? [S.qfStage] : STAGES.map(x => x.c);
  if(qf==="fill" && !wid) return toast(T("Hãy chọn công nhân trước."));
  S.busy = true; if(document.activeElement) document.activeElement.blur();
  try{
    for(let i=0;i<7;i++){ const date = addDays(S.week, i); if(date<S.today) continue;
      if(qf==="fill" && isOff(date)) continue;
      for(const c of codes){ const k = date+"_"+c+"_"+mid;
        if(qf==="clear"){ if(S.assign.has(k)) await setAssign(k, ""); } else await setAssign(k, wid); } }
    toast(T("Đã lưu phân công."));
  }catch(err){ toast(T("Chưa lưu được phân công.")); }
  S.busy = false; renderAssign();
});

/* ---------- report tab ---------- */
function loadReport(){
  if(!S.db) return;
  const r = S.report, ym = r.month;
  if(r.sub===ym) return;
  (r.unsubs||[]).forEach(u => { try{ u(); }catch(e){} });
  r.sub = ym; r.loaded = false; r.gotC = r.gotA = false; r.daily = [];
  const done = () => { if(r.sub!==ym) return; r.loaded = r.gotC && r.gotA; if(S.me && S.tab==="report") renderReport(); };
  const fail = () => { if(r.sub===ym){ r.sub = null; toast(T("Chưa tải được dữ liệu tháng. Thử lại.")); } };
  r.unsubs = [
    S.db.collection("checks").where("month","==",ym).limit(1000).onSnapshot(q => { if(r.sub!==ym) return; r.checks = q.docs.map(d => Object.assign({id:d.id}, d.data())).sort((x,y) => x.id<y.id?-1:1); r.gotC = true; done(); }, fail),
    S.db.collection("approvals").where("month","==",ym).limit(1000).onSnapshot(q => { if(r.sub!==ym) return; r.apprs = new Map(q.docs.map(d => [d.id, d.data()])); r.gotA = true; done(); }, fail),
    S.db.collection("daily").where("month","==",ym).limit(1000).onSnapshot(q => { if(r.sub!==ym) return; r.daily = q.docs.map(d => Object.assign({id:d.id}, d.data())).sort((x,y) => x.id<y.id?-1:1); done(); }, fail),
    S.db.collection("dappr").where("month","==",ym).limit(1000).onSnapshot(q => { if(r.sub!==ym) return; r.dapprs = new Map(q.docs.map(d => [d.id, d.data()])); done(); }, fail)
  ];
}
function paretoHtml(r){
  const cm = new Map(); allLines(r.daily).forEach(({l}) => lineDefs(l).forEach(x => { if(!(x.b2>0)) return; const k = defKey(x), o = cm.get(k) || {q:0, n:0}; o.q += x.b2; o.n++; cm.set(k, o); }));
  const im = new Map(); r.checks.forEach(c => itemsFor(c.shift).forEach(i => { if(c[i.k]==="NG"){ const k = (S.lang==="ja" ? i.sj : i.short) || i.vi; im.set(k, (im.get(k)||0)+1); } }));
  const block = (title, rows, val, extra, empty) => { const tot = rows.reduce((a,x) => a+x.v, 0), max = rows.length ? rows[0].v : 0; let cum = 0, vital = true;
    return '<div class="pblock"><h3>'+T(title)+'</h3>'+(rows.length ? '<div class="prow phead"><span></span><span class="pbar0"></span><span></span><span>'+T("Tỷ lệ")+'</span><span>'+T("Cộng dồn")+'</span></div>'+rows.map(x => { const dark = vital; cum += x.v; if(cum/tot>=0.8) vital = false;
        return '<div class="prow'+(dark?" vital":"")+'"><span class="pl">'+x.label+(extra ? '<small>'+extra(x)+'</small>' : '')+'</span><span class="pbar"><i style="width:'+Math.max(2, Math.round(x.v/max*100))+'%"></i></span><span class="pv mono">'+val(x)+'</span><span class="ps mono">'+Math.round(x.v/tot*100)+'%</span><span class="pc mono">'+Math.round(cum/tot*100)+'%</span></div>'; }).join("") : '<div class="notice">'+T(empty)+'</div>')+'</div>'; };
  const cr = [...cm.entries()].map(([k,o]) => ({label:nmTxt(k), v:o.q, n:o.n})).sort((a,b) => b.v-a.v || b.n-a.n);
  const ir = [...im.entries()].map(([k,n]) => ({label:esc(k), v:n})).sort((a,b) => b.v-a.v);
  return '<div class="panel"><h2>'+T("Thống kê Pareto")+'</h2><div class="pareto">'
    + block("Nguyên nhân hàng loại 2", cr, x => qtyText(Math.round(x.v)), x => T("{n} dòng",{n:x.n}), "Tháng này chưa có hàng loại 2.")
    + block("Hạng mục kiểm không đạt", ir, x => T("{n} lần",{n:x.v}), null, "Tháng này không có lần kiểm nào không đạt.")
    + '</div><div class="sub">'+T("Tỷ lệ: phần của riêng dòng đó. Cộng dồn: cộng tỷ lệ từ dòng đầu xuống đến dòng đó (dòng cuối luôn là 100%).")+'<br>'+T("Màu đậm: nhóm chiếm 80% đầu. Một dòng sản phẩm có nhiều nguyên nhân thì số loại 2 của dòng đó được chia đều.")+'</div></div>';
}
/* Sản lượng và loại 2 theo sản phẩm, theo máy. Tỷ lệ chỉ tính trên các dòng có nhập sản lượng (báo cáo kiểu cũ không có). */
function prodTotals(list){ let q = 0, bq = 0; allLines(list).forEach(({l}) => { if(l.qty!==null && l.qty!==undefined){ q += l.qty||0; bq += l.b2||0; } }); return {q:q, bq:bq}; }
function groupLines(list, keyOf){ const m = new Map(); allLines(list).forEach(x => { const k = keyOf(x) || "—", o = m.get(k) || {q:0, b:0, bq:0, n:0}; o.n++; o.b += x.l.b2||0; if(x.l.qty!==null && x.l.qty!==undefined){ o.q += x.l.qty||0; o.bq += x.l.b2||0; } m.set(k, o); }); return [...m.entries()].sort((a,b) => b[1].q-a[1].q || b[1].b-a[1].b); }

  h += '<div class="pareto">'+grp("Theo sản phẩm", groupLines(r.daily, x => x.l.product))+grp("Theo máy", groupLines(r.daily, x => mName(x.d.machineName)))+'</div>';
  h += '<h3>'+T("Chi tiết theo ngày")+'</h3><div class="scroll"><table><tr><th>'+T("Ngày")+'</th><th>'+T("Máy")+'</th><th>'+T("Tên sản phẩm")+'</th><th>'+T("Sản lượng")+'</th><th>'+T("Hàng loại 2")+'</th><th>'+T("Tỷ lệ loại 2")+'</th><th colspan="2">'+T("Chi tiết loại 2")+'</th><th>'+T("Người nhập")+'</th><th>'+T("Cập nhật")+'</th></tr>'
    +allLines(r.daily).map(({d,l}) => '<tr><td class="d">'+fmtDate(d.date).slice(0,5)+'</td><td>'+esc(mName(d.machineName))+'</td><td>'+esc(nm(l.product))+'</td><td class="mono">'+(l.qty===null || l.qty===undefined ? "—" : qtyText(l.qty))+'</td><td><b class="mono">'+qtyText(l.b2)+'</b></td><td class="mono">'+rateText(l.qty, l.b2)+'</td><td style="white-space:normal;min-width:200px" colspan="2">'+defHtml(l)+'</td><td>'+esc(l.by||d.reporter||"")+'</td><td><span class="mono">'+fmtTime(l.at||d.at)+'</span>'+(dTiming({at:l.at||d.at}).timing==="late" ? ' <span class="chip ng">'+T("Sau 20:00")+'</span>' : '')+'</td></tr>').join("")+'</table></div>';
  return h+'</div>'; }
function b2All(list){ return qtyText(list.reduce((a,d) => a+(d.b2Total||0), 0)); }
function reportStats(){
  const r = S.report, t = {total:r.checks.length, pass:0, fail:0, ontime:0, late:0, early:0, approved:0, pending:0, returned:0};
  r.checks.forEach(c => { isPass(c) ? t.pass++ : t.fail++; t[liveTiming(c).timing||"ontime"]++; t[stateOf(c, r.apprs.get(c.id))]++; });
  return t;
}
function reportMachines(){
  const m = new Map(S.cfg.machines.map(x => [x.id, x.name]));
  S.report.checks.forEach(c => { if(!m.has(c.machineId)) m.set(c.machineId, c.machineName); });
  return [...m.entries()].map(([id,name]) => ({id:id, name:mName(name)}));
}

async function schedRecalc(date, mid){ let n = 0; const items = [];
  for(const [id, c] of S.checks){ if(c.date!==date || !c.firstAt || (mid!=="all" && c.machineId!==mid)) continue;
    const t = timesFor(date, c.machineId, c.shift), d = new Date(c.firstAt), m = d.getHours()*60+d.getMinutes();
    const tm = m > toMin(t.due) ? {timing:"late", lateMin:m-toMin(t.due)} : m < toMin(t.from) ? {timing:"early", lateMin:0} : {timing:"ontime", lateMin:0};
    if(c.due===t.due && c.timing===tm.timing && (c.lateMin||0)===tm.lateMin) continue;
    const nc = Object.assign({}, c, {due:t.due}, tm); await S.db.doc("checks/"+id).set(nc); S.checks.set(id, nc); items.push(sheetCheckRow(id, nc)); n++; }
  sheetSend(items); return n; }

/* Gửi thử có đọc phản hồi của Google để biết chính xác lỗi nằm ở đâu */
async function sheetProbe(){ const body = JSON.stringify({token:SHEET_TOKEN, items:[]});   /* gửi thử không ghi dòng nào */
  let t = "";
  try{ const r = await fetch(S.sheetUrl, {method:"POST", body:body}); t = await r.text(); }
  catch(e){ return {ok:false, msg:T("Không đọc được phản hồi từ Google. Thường do Web App chưa để “Ai có quyền truy cập: Bất kỳ ai” hoặc link sai.")}; }
  let j = null; try{ j = JSON.parse(t); }catch(e){}
  if(j && j.ok) return {ok:true, msg:T("Kết nối tốt. Báo cáo sản xuất sẽ được ghi vào tab “BCSX_CAOSU”.")};
  if(j && j.error==="token") return {ok:false, msg:T("Sheet từ chối vì sai mã: TOKEN trong Apps Script phải là “kachiboshi-caosu”.")};
  if(j && j.error) return {ok:false, msg:T("Apps Script báo lỗi: {e}",{e:j.error})};
  if(/doPost/i.test(t)) return {ok:false, msg:T("Bản đã triển khai chưa có hàm doPost. Vào Triển khai → Quản lý triển khai → ✎ → Phiên bản: Phiên bản mới → Triển khai.")};
  if(/accounts\.google|ServiceLogin|signin/i.test(t)) return {ok:false, msg:T("Web App đang bắt đăng nhập. Sửa triển khai: “Thực thi với tư cách: Tôi”, “Ai có quyền truy cập: Bất kỳ ai”.")};
  if(/null|getSheetByName|insertSheet/i.test(t)) return {ok:false, msg:T("Apps Script không gắn với file Google Sheet. Hãy mở file Sheet → Tiện ích mở rộng → Apps Script, dán mã vào đó rồi triển khai lại (hoặc điền SHEET_ID trong mã).")};
  return {ok:false, msg:T("Phản hồi lạ từ Google: {t}",{t:t.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,160)})}; }

function sheetApprRow(id, a, c){ return {sheet:"Duyệt", key:id, row:{"Ngày":vnD(a.date), "Ca":c ? (c.shift==="S" ? "Sáng" : "Chiều") : "", "Máy":c ? c.machineName||"" : "", "Người kiểm":c ? c.checker||"" : "", "Trạng thái":a.status==="approved" ? "Đã duyệt" : a.status==="returned" ? "Trả lại" : a.status, "Người duyệt":a.approver||"", "Thời gian duyệt":vnDT(a.at), "Biện pháp":a.action||"", "Lý do trả lại":a.status==="returned" ? a.note||"" : ""}}; }
function sheetDailyRows(key, d){ return dLines(d).map(l => ({sheet:SHEET_DAILY, key:key+"_"+l.id, row:{"Ngày":vnD(d.date), "Máy":d.machineName||"", "Tên sản phẩm":l.product||"", "Sản lượng (đôi)":l.qty===null || l.qty===undefined ? "" : l.qty, "Sản lượng":l.qty===null || l.qty===undefined ? "" : vnQ(l.qty), "Loại 2 (đôi)":l.b2||0, "Loại 2":vnQ(l.b2), "Tỷ lệ loại 2 (%)":l.qty>0 ? Math.round((l.b2||0)/l.qty*1000)/10 : "", "Nguyên nhân":(l.causes||[]).join("; "), "Chi tiết loại 2":defText(l), "Ghi chú":l.note||"", "Người nhập":l.by||d.reporter||"", "Cập nhật lúc":vnDT(l.at||d.at)}})); }
/* Lệnh xoá dòng trên Sheet: theo mã dòng, theo mã báo cáo (mọi dòng của một máy trong ngày), hoặc theo khoảng ngày */
const sheetDel = o => Object.assign({sheet:SHEET_DAILY, row:{}}, o);
function sheetQueue(){ try{ return JSON.parse(lsGet(SHEET_Q)||"[]"); }catch(e){ return []; } }
async function sheetPost(items){ items = sheetOnly(items); if(!items.length) return; await fetch(S.sheetUrl, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({token:SHEET_TOKEN, items:items})}); }
/* Gửi không chặn thao tác của người dùng; mất mạng thì giữ lại trên máy và gửi lại sau */
async function sheetSend(items){ items = sheetOnly(items); if(!items.length || !S.sheetUrl) return; const q = sheetQueue().concat(items);
  lsSet(SHEET_Q, JSON.stringify(q.slice(-2000)));
  try{ for(let i=0; i<q.length; i+=200) await sheetPost(q.slice(i, i+200)); lsSet(SHEET_Q, null); }catch(e){} }
async function sheetFlush(){ const q = sheetQueue(); if(!S.sheetUrl || !q.length) return; try{ for(let i=0; i<q.length; i+=200) await sheetPost(q.slice(i, i+200)); lsSet(SHEET_Q, null); }catch(e){} }
/* ---------- dọn dữ liệu cũ (chỉ admin, cần mật khẩu xoá) ---------- */
const PURGE_PW = "112";
const PURGE_COLS = ["checks","approvals","daily","dappr","steps","off","sched","incidents"];
/* Xoá theo khoảng ngày do Admin chọn (tính theo ngày kiểm / ngày báo cáo) */
const ymText = ym => ym.slice(5)+"/"+ym.slice(0,4);
function purgePanel(){ const pg = S.purge || (S.purge = {from:"", to:"", plan:null, running:false});
  return '<div class="panel danger"><h2>'+T("Dọn dữ liệu")+'</h2><div class="sub">'+T("Chọn khoảng ngày cần xoá. Xoá xong không khôi phục được: hãy xuất Excel các tháng cần lưu trước khi xoá.")+'</div>'
    +'<div class="row"><label class="f" for="pFrom">'+T("Từ ngày")+'<input type="date" id="pFrom" value="'+esc(pg.from)+'"'+(pg.running?" disabled":"")+'></label><label class="f" for="pTo">'+T("Đến ngày")+'<input type="date" id="pTo" value="'+esc(pg.to)+'"'+(pg.running?" disabled":"")+'></label>'
    +'<label class="f" for="purgePw">'+T("Mật khẩu xoá dữ liệu")+'<input type="password" id="purgePw" autocomplete="off" inputmode="numeric"'+(pg.running?" disabled":"")+'></label></div>'
    +'<div class="sub">'+T("Gồm phiếu kiểm, kết quả duyệt, ảnh, bước đầu ca, báo cáo sản xuất, ngày nghỉ. Không xoá tài khoản, danh sách sản phẩm, nguyên nhân lỗi và cài đặt máy.")+'</div>'
    +(pg.plan ? '<div class="alert">'+T("Sẽ xoá {n} bản ghi từ {a} đến {b}: {d}.",{n:pg.plan.items.length, a:fmtDate(pg.plan.from), b:fmtDate(pg.plan.to), d:pg.plan.desc})+'</div>' : '')
    +'<div class="row">'+(pg.plan ? '<button class="btn warn" id="purgeRun"'+(pg.running?" disabled":"")+'>'+T("Xác nhận xoá")+'</button><button class="btn" id="purgeCancel"'+(pg.running?" disabled":"")+'>'+T("Huỷ")+'</button>' : '<button class="btn warn" id="purgeScan">'+T("Kiểm tra dữ liệu sẽ xoá")+'</button>')+'</div>'
    +'<div class="sub" id="purgeMsg"></div></div>'; }
function purgePwOk(){ const el = $("#purgePw"); if(!el || el.value!==PURGE_PW){ toast(T("Sai mật khẩu xoá dữ liệu.")); return false; } return true; }
async function purgeScan(){
  if(S.busy) return;
  const from = $("#pFrom").value, to = $("#pTo").value; S.purge.from = from; S.purge.to = to;
  if(!from || !to) return toast(T("Hãy chọn đủ từ ngày và đến ngày."));
  if(from>to) return toast(T("Từ ngày phải trước hoặc bằng đến ngày."));
  if(!purgePwOk()) return;
  const items = [], count = {}, pw = $("#purgePw").value, inR = d => d>=from && d<=to;
  S.busy = true; $("#purgeMsg").textContent = T("Đang kiểm tra dữ liệu…");
  try{
    for(const c of PURGE_COLS){ const q = await S.db.collection(c).get(); const ids = q.docs.filter(d => inR(((d.data()||{}).date || d.id).slice(0,10))).map(d => d.id); count[c] = ids.length; ids.forEach(id => items.push([c, id]));
      if(c==="checks") ids.forEach(id => items.push(["photos", id]));
      if(c==="steps") q.docs.filter(d => ids.includes(d.id)).forEach(d => { const id = d.id, i = id.indexOf("_"); items.push(["photos", id.slice(0,i)+"_S_"+id.slice(i+1)+"s"]); ((d.data()||{}).samples||[]).forEach(x => items.push(["photos", id.slice(0,i)+"_S_"+id.slice(i+1)+"s"+x.n])); }); }
    const qa = await S.db.collection("assign").where("adate", ">=", from).get(); const as = qa.docs.filter(d => (d.data().adate||"")<=to); count.assign = as.length; as.forEach(d => items.push(["assign", d.id]));
    count.photos = items.filter(x => x[0]==="photos").length;
    const lab = {checks:"phiếu kiểm", approvals:"kết quả duyệt", daily:"báo cáo sản xuất", steps:"bước đầu ca", photos:"ảnh (nếu có)", dappr:"duyệt báo cáo cũ", off:"ngày nghỉ", sched:"giờ điều chỉnh theo ngày", incidents:"báo cáo sự cố", assign:"phân công cũ"};
    S.purge.plan = {items:items, from:from, to:to, desc:Object.keys(lab).filter(k => count[k]).map(k => count[k]+" "+T(lab[k])).join(", ") || T("không có")};
    if(!items.length){ S.purge.plan = null; toast(T("Không có dữ liệu nào cần xoá.")); }
  }catch(err){ toast(T("Chưa đọc được dữ liệu. Kiểm tra mạng rồi thử lại.")); }
  S.busy = false; renderSettings(); const el = $("#purgePw"); if(el) el.value = pw;
}
async function purgeRun(){
  const pg = S.purge; if(S.busy || !pg.plan || !purgePwOk()) return;
  S.busy = true; pg.running = true; renderSettings(); $("#purgePw").value = PURGE_PW;
  const items = pg.plan.items, gone = []; let done = 0, fail = 0;
  for(let i=0; i<items.length; i+=25){
    await Promise.all(items.slice(i, i+25).map(([c,id]) => S.db.doc(c+"/"+id).delete().then(() => { done++; if(c==="daily") gone.push(id); }, () => { fail++; })));
    const m = $("#purgeMsg"); if(m) m.textContent = T("Đang xoá… {a}/{b}",{a:done+fail, b:items.length}); }
  if(gone.length) sheetSend(gone.map(id => sheetDel({del:"prefix", key:id+"_"})));   /* báo cáo sản xuất đã xoá trên app thì xoá luôn các dòng tương ứng trên Google Sheet */
  S.busy = false; pg.running = false; pg.plan = null; S.report.loaded = false; S.photos = new Map();
  toast(fail ? T("Đã xoá {n} bản ghi, {f} bản ghi chưa xoá được. Thử lại sau.",{n:done, f:fail}) : T("Đã xoá {n} bản ghi.",{n:done}));
  renderSettings();
}
$("#tab-settings").addEventListener("change", e => { if((e.target.id==="pFrom" || e.target.id==="pTo") && S.purge){ S.purge[e.target.id==="pFrom" ? "from" : "to"] = e.target.value; if(S.purge.plan){ S.purge.plan = null; const pw = $("#purgePw").value; renderSettings(); $("#purgePw").value = pw; } } });
$("#tab-settings").addEventListener("click", async e => {
  if(S.me.role!=="admin" && /^(sheet|purge)/.test(e.target.id||"")) return;   /* Quản đốc không dùng Google Sheet và dọn dữ liệu */
  if(e.target.id==="purgeScan") return purgeScan();
  if(e.target.id==="sheetSave"){ const u = $("#sheetUrl").value.trim(); if(u && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) return toast(T("Link phải có dạng https://script.google.com/…/exec"));
    try{ await S.db.doc("config/sheet").set({url:u, at:new Date().toISOString(), by:S.me.name}); toast(T(u ? "Đã lưu link Google Sheet." : "Đã ngắt kết nối Google Sheet.")); }catch(err){ toast(T("Chưa lưu được cài đặt.")); } return; }
  if(e.target.id==="sheetTest"){ e.target.disabled = true; S.sheetUi = Object.assign(S.sheetUi || {}, {msg:T("Đang gửi thử…"), ok:null}); renderSettings();
    const r = await sheetProbe(); S.sheetUi.msg = r.msg; S.sheetUi.ok = r.ok; if(r.ok) sheetFlush(); return renderSettings(); }
  if(e.target.id==="sheetMonth") return sheetMonthSend(S.today.slice(0,7));
  if(e.target.id==="sheetPrev") return sheetMonthSend(prevMonth(S.today.slice(0,7)));
  if(e.target.id==="purgeRun") return purgeRun();
  if(e.target.id==="purgeCancel"){ S.purge.plan = null; return renderSettings(); }
  const b = e.target.closest("button"); if(!b || S.busy) return;
  if(b.dataset.ladd || b.dataset.ldel || b.dataset.jsave){ const kind = b.dataset.ladd || b.dataset.jsave || b.dataset.kind; let list = S[kind].slice(), extra = null;
    if(b.dataset.ladd){ const name = $("#new_"+kind).value.trim().replace(/[,;]/g," "); if(!name) return toast(T("Hãy nhập tên trước.")); if(list.includes(name)) return toast(T("Tên này đã có trong danh sách.")); list.push(name); extra = {[name]:$("#newja_"+kind).value.replace(/[,;]/g," ")}; }
    else if(b.dataset.ldel){ if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent=T("Bấm lần nữa để xoá"); return; } list = list.filter(x => x!==b.dataset.ldel); }
    const doc = listDoc(kind, list, extra);
    if(b.dataset.jsave && doc.ja.every((v, i) => v===jaOf(kind, list[i]))) return toast(T("Không có gì thay đổi."));
    S.busy = true;
    try{ await S.db.doc(LISTS[kind].doc).set(doc); if(document.activeElement) document.activeElement.blur(); toast(T("Đã lưu cài đặt.")); }catch(err){ toast(T("Chưa lưu được cài đặt.")); }
    S.busy = false; return; }
  if(!isMgr()) return;
  const cfg = {autoAdded:true, logoAdded:true, machines:S.cfg.machines.map(x => Object.assign({}, x)), times2:Object.fromEntries(SLOTS.map(k => [k, Object.assign({}, S.cfg.times[k])])), steps:{}};
  if(b.id==="addMachine"){ const name = $("#newMachine").value.trim(); if(!name) return toast(T("Hãy nhập tên máy trước.")); cfg.machines.push({id:"m"+Date.now().toString(36), name:name, nameJa:$("#newMachineJa").value.trim()}); }
  else if(b.dataset.del){ if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent=T("Bấm lần nữa để xoá"); return; } cfg.machines = cfg.machines.filter(x => x.id!==b.dataset.del); }
  else if(b.dataset.savem){ const card = b.closest("[data-mc]"), g = k => card.querySelector('[data-f="'+k+'"]'), m = cfg.machines.find(x => x.id===b.dataset.savem);
    const name = g("name").value.trim(); if(!name) return toast(T("Hãy nhập tên máy trước."));
    m.name = name; m.nameJa = g("nameJa").value.trim(); m.two = g("two").checked;
    for(const k of ["tMin","tMax","t2Min","t2Max","sMin","sMax"]) m[k] = has(g(k).value.trim()) ? numOf(g(k).value) : null;
    if([["tMin","tMax"],["t2Min","t2Max"],["sMin","sMax"]].some(p => has(m[p[0]]) && has(m[p[1]]) && m[p[0]]>m[p[1]])) return toast(T("Khoảng chuẩn không hợp lệ: số “từ” phải nhỏ hơn số “đến”.")); }
  else if(b.id==="saveTimes"){ for(const s of SLOTS){ const f = $("#from"+s).value, d = $("#due"+s).value; if(!f || !d || toMin(f)>=toMin(d)) return toast(T("Ca {s}: giờ bắt đầu phải trước giờ hạn.",{s:shiftL(s)})); cfg.times2[s] = {from:f, due:d}; }
  }
  else return;
  S.busy = true;
  try{ await S.db.doc("config/main").set(cfg); if(document.activeElement) document.activeElement.blur(); toast(T("Đã lưu cài đặt.")); }catch(err){ toast(T("Chưa lưu được cài đặt.")); }
  S.busy = false;
});

/* ---------- boot ---------- */
function prevMonth(ym){ const p = ym.split("-").map(Number), d = new Date(p[0], p[1]-2, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
async function start(){
  render();
  try{ await Promise.all([loadScript(FB_URL+"firebase-app-compat.js")]); await loadScript(FB_URL+"firebase-firestore-compat.js"); }catch(e){}
  S.downloads = true; S.ready = true;
  if(typeof firebase==="undefined"){ S.dbErr = "Không tải được thư viện Firebase. Kiểm tra mạng rồi tải lại trang."; return render(); }
  try{ firebase.initializeApp(firebaseConfig);
    /* Lưu đệm dữ liệu trên máy: lần mở sau hiện ngay từ bộ nhớ đệm rồi mới đồng bộ, và vẫn xem được khi mạng chập chờn */
    try{ await firebase.firestore().enablePersistence({synchronizeTabs:true}); }catch(e){}
    S.db = makeDb(); }catch(e){ S.dbErr = "Không tải được thư viện Firebase. Kiểm tra mạng rồi tải lại trang."; return render(); }
  S.sample = TRANSLATE_API_KEY ? true : null;
  const db = S.db;
  const fail = e => { if(e && e.code==="permission-denied"){ S.dbErr = "Firestore từ chối truy cập. Hãy mở quyền đọc/ghi cho collection này trong Security Rules rồi tải lại trang."; S.me = null; render(); } else toast(T("Mất kết nối dữ liệu. Tải lại trang.")); };
  db.collection("accounts").onSnapshot(q => { S.accounts = new Map(q.docs.map(d => [d.id, d.data()])); S.accLoaded = true; syncSession(); render(); if(S.me && S.tab==="report" && !S.report.loaded) loadReport(); }, fail);
  db.doc("config/sheet").onSnapshot(s => { const d = s.exists ? s.data() : {}; S.sheetUrl = d.url!==undefined && !OLD_SHEET_URLS.includes(d.url) ? d.url : DEFAULT_SHEET_URL; S.sheetUrlSet = true; S.sheetAt = d.at || ""; sheetFlush(); if(S.tab==="settings" && !typingIn("#tab-settings")) renderSettings(); }, () => {});
  db.doc("config/main").onSnapshot(s => { const d = s.exists ? s.data() : {};
    const saved = Array.isArray(d.machines) && d.machines.length ? d.machines : null;
    S.cfg = {machines: saved || DEFAULT_MACHINES,
             times: Object.fromEntries(SLOTS.map(k => [k, Object.assign({}, DEFAULT_TIMES[k], d.times2 && d.times2[k])])), steps:Object.assign({}, d.steps)};
    render(); }, fail);
  /* Theo dõi trực tiếp tháng này và tháng trước (để phiếu cuối tháng vẫn hiện ở tab Duyệt). */
  ["products","defects"].forEach(kind => db.doc(LISTS[kind].doc).onSnapshot(s => { const d = s.exists ? s.data() : {}; S[kind] = Array.isArray(d.list) ? d.list : [];
    const ja = Array.isArray(d.ja) ? d.ja : [], m = {}; S[kind].forEach((x, i) => { if(ja[i]) m[x] = ja[i]; }); S.listJa[kind] = m; render(); }, () => {}));
  const cur = S.today.slice(0,7), live = {checks:{}, approvals:{}, fappr:{}, daily:{}, steps:{}, dappr:{}, sched:{}, incidents:{}};
  [cur, prevMonth(cur)].forEach(ym => { ["checks","approvals","fappr","daily","steps","dappr","sched","incidents"].forEach(c => {
    db.collection(c).where("month","==",ym).onSnapshot(q => { live[c][ym] = q.docs;
      const m = new Map(); Object.values(live[c]).forEach(ds => ds.forEach(d => m.set(d.id, d.data())));
      if(c==="checks") S.checks = m; else if(c==="approvals") S.apprs = m; else if(c==="daily") S.daily = m; else if(c==="dappr") S.dapprs = m; else if(c==="fappr") S.fapprs = m; else if(c==="sched") S.sched = m; else if(c==="incidents") S.incs = m; else { S.steps = m; paintSteps(); }
      render(); }, fail); }); });
  db.collection("tr").onSnapshot(q => { let n = 0; q.docs.forEach(d => { const o = d.data().out; if(o && S.tr.get(d.id)!==o){ S.tr.set(d.id, o); n++; } }); if(n) refresh(); }, () => {});
  S.week = mondayOf(S.today);
  if(S.db) S.db.collection("assign").where("adate",">=",addDays(S.today,-14)).limit(1000).onSnapshot(q => { S.assign = new Map(q.docs.map(d => [d.id, d.data()])); render(); }, () => {});
  if(S.db) S.db.collection("off").limit(1000).onSnapshot(q => { S.off = new Set(q.docs.map(d => d.id)); render(); if(S.me && S.tab==="report") renderReport(); }, () => {});
  setInterval(() => { sheetFlush(); if(isDevice() && S.op){ const idle = Date.now()-S.opAt; if((idle>180000 && !S.form.dirty && !S.sform.dirty && !typingIn("#tab-check")) || idle>900000) opOut(); }
    const t = ymd(new Date()); if(t!==S.today && !S.form.dirty && !S.dform.dirty && !S.sform.dirty){ S.today = t; render(); } else if(S.me && S.tab==="daily" && !S.dform.dirty && !typingIn("#tab-daily")) renderDaily(); else if(S.me && S.tab==="incident" && !typingIn("#tab-incident")) renderIncident(); }, 60000);
}
/* Bấm vào ảnh để xem phóng to; bấm lần nữa để phóng to hơn, bấm nền hoặc ✕ để đóng */
document.addEventListener("click", e => { const im = e.target.closest("img.photo, img.thumb, img.fth, img.dth"); if(!im || im.closest("#lightbox")) return;
  e.preventDefault(); e.stopPropagation();
  let lb = document.getElementById("lightbox");
  if(!lb){ lb = document.createElement("div"); lb.id = "lightbox"; lb.innerHTML = '<button type="button" class="lbx" aria-label="'+T("Đóng")+'">✕</button><div class="lbw"><img alt=""></div><div class="lbh">'+T("Chạm vào ảnh để phóng to thêm · chạm nền để đóng")+'</div>'; document.body.appendChild(lb);
    lb.addEventListener("click", ev => { const img = ev.target.closest(".lbw img"); if(img){ lb.classList.toggle("zoom"); return; } lb.hidden = true; lb.classList.remove("zoom"); document.body.style.overflow = ""; }); }
  lb.querySelector(".lbw img").src = im.src; lb.classList.remove("zoom"); lb.hidden = false; document.body.style.overflow = "hidden"; }, true);
document.addEventListener("keydown", e => { const lb = document.getElementById("lightbox"); if(e.key==="Escape" && lb && !lb.hidden){ lb.hidden = true; document.body.style.overflow = ""; } });
start();
})();
